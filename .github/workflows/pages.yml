name: Publicar Orquivia en GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Pruebas de aplicación y permisos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verificar todas las suites PostgreSQL aisladas
        run: node scripts/verify-postgres.mjs
      - name: Comprobar vulnerabilidades de dependencias
        run: npm audit --audit-level=high
  secrets:
    name: Revisar secretos en Git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
  build:
    name: Comprobar publicación y compatibilidad
    runs-on: ubuntu-latest
    needs: [verify, secrets]
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      VITE_APP_MODE: production
      VITE_DOCUMENT_MAIL: 'true'
      # Pull requests build against a synthetic public configuration, never a live account.
      # Production still fails closed if either real repository variable is missing.
      VITE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://abcdefghijklmnopqrst.supabase.co' || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_ci_fixture_not_a_secret' || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 087ed89525e2f6d5ccc08ad7d334cc92a7f761a2
          path: legacy-mail
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 055cf6b3d7481824b4a4522f6568fe4253322f2d
          path: compat-1-2
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8ec6851962a40c07d6236d0f39af648b2364b6ef
          path: compat-1-3
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 1625e0494638fb6c782e4f8cbdf02b08ec4d3bb2
          path: compat-stable-1-4
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:production
      - name: Conservar los recursos de las pestañas de pruebas abiertas
        run: npm ci && npm run build:production
        working-directory: legacy-mail
      - name: Conservar los recursos de las pestañas operativas 1.2
        run: npm ci && npm run build:production
        working-directory: compat-1-2
      - name: Conservar los recursos de las pestañas operativas 1.3
        run: npm ci && npm run build:production
        working-directory: compat-1-3
      - name: Conservar los recursos de la versión estable 1.4.1
        run: npm ci && npm run build:production
        working-directory: compat-stable-1-4
      - name: Preparar URL única y compatibilidad con enlaces anteriores
        run: node scripts/prepare-release.mjs --legacy-dist legacy-mail/dist --previous-dist compat-1-2/dist --previous-dist compat-1-3/dist --previous-dist compat-stable-1-4/dist
      - name: Revisar el artefacto público completo
        run: node scripts/check-public-build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
