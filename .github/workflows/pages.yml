name: Verificar Orquívia 1.1
on:
  push:
    branches: [codex/email-v1-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node supabase/tests/document-mail-postgres.mjs
      - run: npm run build:production
        env:
          VITE_APP_MODE: production
          VITE_DOCUMENT_MAIL: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
