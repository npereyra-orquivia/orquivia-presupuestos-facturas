name: Comprobar disponibilidad pública de Orquivia
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      test_failure_notification:
        description: 'Prueba controlada del aviso de fallo; no cambia el portal'
        required: false
        type: boolean
        default: false
permissions: {}
concurrency:
  group: operations-monitor
  cancel-in-progress: false
jobs:
  public-availability:
    name: Portal y servicio público de acceso
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ORQUIVIA_PORTAL_URL: https://npereyra-orquivia.github.io/orquivia-presupuestos-facturas/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Comprobar sin acceder a datos privados
        run: node scripts/operations/monitor.mjs
      # A failed run is visible in GitHub Actions. Each maintainer controls their
      # own GitHub failure notifications; this workflow sends no client emails.
      # Success is not evidence that a backup, the database or SMTP was tested.
  notification-test:
    name: Prueba controlada del aviso (el portal no está caído)
    needs: public-availability
    if: >-
      github.repository == 'npereyra-orquivia/orquivia-presupuestos-facturas' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.test_failure_notification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Generar únicamente el fallo de prueba solicitado
        run: |
          echo 'Prueba controlada para comprobar los avisos de GitHub Actions. El portal no se ha modificado ni se ha simulado una caída.'
          exit 1
