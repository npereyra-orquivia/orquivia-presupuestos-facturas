name: Comprobar disponibilidad pública de Orquivia
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: operations-monitor
  cancel-in-progress: false
jobs:
  public-availability:
    name: Portal y servicio público de acceso
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ORQUIVIA_PORTAL_URL: https://npereyra-orquivia.github.io/orquivia-presupuestos-facturas/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Comprobar sin acceder a datos privados
        run: node scripts/operations/monitor.mjs
      # A failed run is visible in GitHub Actions. Each maintainer controls their
      # own GitHub failure notifications; this workflow sends no client emails.
      # Success is not evidence that a backup, the database or SMTP was tested.
