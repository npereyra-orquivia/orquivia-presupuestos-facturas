name: Copia cifrada de Orquivia (requiere activación)
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: orquivia-encrypted-backup
  cancel-in-progress: false
jobs:
  encrypted-backup:
    name: Capturar y verificar en Drive privado
    # These must be repository variables. Missing values keep every run dormant.
    if: >-
      github.repository == 'npereyra-orquivia/orquivia-presupuestos-facturas' &&
      github.ref == 'refs/heads/main' &&
      vars.ORQUIVIA_BACKUPS_ENABLED == 'true' &&
      vars.ORQUIVIA_BACKUP_RESTORE_REHEARSED == 'true'
    environment: orquivia-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      # Official postgres:17-bookworm, registry digest checked 2026-10-27.
      # Runs on GitHub's runner; Docker Desktop on the operator's PC is unused.
      image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    steps:
      - name: Preparar Git desde los repositorios oficiales de Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Comprobar herramientas sin credenciales
        run: |
          node --version
          git --version
          pg_dump --version
          pg_dumpall --version
          psql --version
      - name: Cifrar, comprobar y subir una sola vez
        env:
          ORQUIVIA_BACKUPS_ENABLED: ${{ vars.ORQUIVIA_BACKUPS_ENABLED }}
          ORQUIVIA_BACKUP_RESTORE_REHEARSED: ${{ vars.ORQUIVIA_BACKUP_RESTORE_REHEARSED }}
          ORQUIVIA_BACKUP_SUPABASE_URL: https://tfaglecwycbamibnhqmq.supabase.co
          ORQUIVIA_BACKUP_KEY: ${{ secrets.ORQUIVIA_BACKUP_KEY }}
          ORQUIVIA_BACKUP_DATABASE_URL: ${{ secrets.ORQUIVIA_BACKUP_DATABASE_URL }}
          ORQUIVIA_BACKUP_SERVICE_ROLE_KEY: ${{ secrets.ORQUIVIA_BACKUP_SERVICE_ROLE_KEY }}
          ORQUIVIA_BACKUP_ACCESS_TOKEN: ${{ secrets.ORQUIVIA_BACKUP_ACCESS_TOKEN }}
          ORQUIVIA_BACKUP_RECOVERY_JSON: ${{ secrets.ORQUIVIA_BACKUP_RECOVERY_JSON }}
          ORQUIVIA_DRIVE_UPLOAD_ENABLED: ${{ vars.ORQUIVIA_DRIVE_UPLOAD_ENABLED }}
          ORQUIVIA_DRIVE_FOLDER_ID: ${{ vars.ORQUIVIA_DRIVE_FOLDER_ID }}
          ORQUIVIA_DRIVE_ALLOWED_EMAILS: ${{ secrets.ORQUIVIA_DRIVE_ALLOWED_EMAILS }}
          ORQUIVIA_DRIVE_CLIENT_ID: ${{ secrets.ORQUIVIA_DRIVE_CLIENT_ID }}
          ORQUIVIA_DRIVE_CLIENT_SECRET: ${{ secrets.ORQUIVIA_DRIVE_CLIENT_SECRET }}
          ORQUIVIA_DRIVE_REFRESH_TOKEN: ${{ secrets.ORQUIVIA_DRIVE_REFRESH_TOKEN }}
        run: node scripts/backup/run-scheduled.mjs
      # No upload-artifact, logs of payloads, automatic deletion or second upload.
      # Only ciphertext exists under RUNNER_TEMP, outside the published repository.
      # A successful capture/upload still reports recoveryTested: false.
