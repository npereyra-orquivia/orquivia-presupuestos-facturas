version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      development-patches:
        dependency-type: development
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
